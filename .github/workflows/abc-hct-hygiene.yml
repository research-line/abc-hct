name: abc-hct hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Syntax, policy and automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest ruff

      - name: Lint codebase
        run: ruff check .

      - name: Compile Python entry points
        run: python -m compileall -q _scripts _compute_queue/scripts

      - name: Run automated test suite
        run: pytest

      - name: Check private research repository policy
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          required_ignore_rules = [
              "BEWEISNOTIZ*.md",
              "_proof-notes/",
              "_handoffs/",
              "_data/",
              "logs/",
              "_results/*.log",
              "_compute_queue/logs/",
              "_compute_queue/state/*.json",
              "_results/*.pid",
              "_results/PROOF_PAPER_MATH_CHECK_*.md",
              "_results/REVIEW_CHAIN_*.md",
          ]
          gitignore = Path(".gitignore").read_text(encoding="utf-8")
          missing = [rule for rule in required_ignore_rules if rule not in gitignore]
          if missing:
              print("Missing required .gitignore rules:", ", ".join(missing))
              sys.exit(1)

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
              encoding="utf-8",
          ).splitlines()
          forbidden_exact = {
              "BEWEISNOTIZ.md",
              "GAPS.md",
              "TODO.md",
              "MEMORY.md",
              "AKTIONSPLAN.md",
          }
          forbidden_prefixes = (
              "_proof-notes/",
              "_handoffs/",
              "_data/",
              "logs/",
              "_logs/",
          )
          forbidden_globs = (
              "_results/PROOF_PAPER_MATH_CHECK_*.md",
              "_results/REVIEW_CHAIN_*.md",
          )
          violations = [
              path
              for path in tracked
              if Path(path).name in forbidden_exact
              or path.startswith(forbidden_prefixes)
              or any(Path(path).match(pattern) for pattern in forbidden_globs)
          ]
          if violations:
              print("Forbidden internal files are tracked:")
              print("\n".join(violations))
              sys.exit(1)

          local_path_tokens = (
              r"C:\Users\User\\",
              "C:/Users/User/",
              "/c/Users/User/",
              "/mnt/c/Users/User/",
          )
          text_suffixes = {
              ".md",
              ".txt",
              ".py",
              ".sh",
              ".ps1",
              ".json",
              ".jsonl",
              ".yml",
              ".yaml",
              ".toml",
          }
          # Diese Workflow-Datei und tests/test_policy.py definieren die Suchmuster
          # selbst als String-Literale und sind daher keine echten Leaks.
          exempt_files = {
              ".github/workflows/abc-hct-hygiene.yml",
              "tests/test_policy.py",
          }
          path_leaks = []
          for path in tracked:
              if path in exempt_files:
                  continue
              if Path(path).suffix.lower() not in text_suffixes:
                  continue
              try:
                  content = Path(path).read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              if any(token in content for token in local_path_tokens):
                  path_leaks.append(path)
          if path_leaks:
              print("Tracked files contain host-specific absolute paths:")
              print("\n".join(path_leaks))
              sys.exit(1)
