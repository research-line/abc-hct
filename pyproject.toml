[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-hct"
version = "0.1.13"
description = "Curated calculation scripts, reproduction harness codes, and machine-readable result certificates for Hecke curves and Manin-Hecke quotients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    { name = "HCT Research Line Team" }
]
keywords = [
    "abc-conjecture",
    "hecke-algebra",
    "mathematics",
    "number-theory",
    "research",
    "open-science",
    "reproducible-research",
    "zenodo",
    "algebraic-geometry",
    "arithmetic-geometry",
    "computational-mathematics",
    "local-first",
    "modular-curves",
    "modular-forms",
    "open-bricks",
    "pari-gp",
    "sagemath",
    "frey-curves",
    "manin-symbols",
    "no-magma"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/research-line/abc-hct"
Repository = "https://github.com/research-line/abc-hct"
Documentation = "https://github.com/research-line/abc-hct#readme"
"Bug Tracker" = "https://github.com/research-line/abc-hct/issues"
Changelog = "https://github.com/research-line/abc-hct/blob/main/CHANGELOG.md"
Security = "https://github.com/research-line/abc-hct/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/research-line"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/research-line/abc-hct/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/research-line/abc-hct/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text Licenses" = "https://github.com/research-line/abc-hct/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/research-line/abc-hct/blob/main/THIRD_PARTY_LICENSES.md"
Notice = "https://github.com/research-line/abc-hct/blob/main/NOTICE"
"Marketing Log" = "https://github.com/research-line/abc-hct/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/research-line/abc-hct/blob/main/llms.txt"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --basetemp=.pytest_temp"
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".pytest_tmp*", ".ruff_cache", "__pycache__", "build", "dist", "assets", "_compute_queue", "_results", "_data"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"_scripts/*" = ["B", "C4", "E401", "E402", "E701", "E702", "E731", "E741", "F401", "F403", "F405", "F541", "F841", "I", "PT", "RUF", "SIM", "UP", "W291", "W293"]
"_compute_queue/*" = ["B", "C4", "E401", "E402", "E701", "E702", "E731", "E741", "F401", "F403", "F405", "F541", "F841", "I", "PT", "RUF", "SIM", "UP", "W291", "W293"]
"tests/*" = ["E501"]
